name: Windows RDP via Ngrok

on:
  schedule:
    - cron: '0 */6 * * *'  # تجديد تلقائي كل 6 ساعات
  workflow_dispatch:        # زر التشغيل اليدوي بنقرة واحدة
  push:

concurrency:
  group: rdp-session
  cancel-in-progress: true

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360  # الحد الأقصى 6 ساعات
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 1

    - name: Download Tools (Ngrok & Rclone)
      run: |
        Invoke-WebRequest "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath "$env:USERPROFILE"
        Remove-Item ngrok.zip
        Copy-Item "$env:USERPROFILE\ngrok.exe" "$env:GITHUB_WORKSPACE\ngrok.exe"

        Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile rclone.zip
        Expand-Archive rclone.zip -DestinationPath "$env:USERPROFILE\rclone"
        Remove-Item rclone.zip
        $rclonePath = (Get-ChildItem -Path "$env:USERPROFILE\rclone" -Filter "rclone.exe" -Recurse).FullName
        Copy-Item $rclonePath "$env:GITHUB_WORKSPACE\rclone.exe"

    - name: Configure Rclone with Mega
      continue-on-error: true
      env:
        MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
        MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:MEGA_EMAIL) -or [string]::IsNullOrWhiteSpace($env:MEGA_PASSWORD)) {
            Write-Host "ℹ️ Mega credentials not set in secrets. Skipping Mega configuration."
            exit 0
        }
        try {
            $obscuredPass = .\rclone.exe obscure "$env:MEGA_PASSWORD"
            .\rclone.exe config create mymega mega user "$env:MEGA_EMAIL" pass "$obscuredPass"
            .\rclone.exe mkdir mymega:RDP_Backup
            Write-Host "✅ Mega configured successfully!"
        } catch {
            Write-Warning "⚠️ Mega setup warning: $_"
        }

    - name: Authenticate Ngrok
      run: |
        $ErrorActionPreference = "Stop"
        $enc = "MzZuSlJ4dkJ2Z3NZY1NKdWQ2QWRhc0QxR1E0X0s2eWF1bmRSM1dHM1Y2OENLbmFT"
        $token = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($enc))
        .\ngrok.exe authtoken "$token"
        Write-Host "✅ Ngrok Authenticated with valid token successfully!"

    - name: Enable RDP, Disable NLA, and Open Firewall
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
        New-NetFirewallRule -DisplayName "Allow RDP via Ngrok" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 -ErrorAction SilentlyContinue
        
        Set-Service -Name TermService -StartupType Automatic
        Restart-Service -Name TermService -Force
        Start-Sleep -Seconds 3

    - name: Create Dedicated User
      run: |
        secedit /export /cfg c:\secpol.cfg
        (Get-Content c:\secpol.cfg).replace("PasswordComplexity = 1", "PasswordComplexity = 0").replace("MinimumPasswordLength = 8", "MinimumPasswordLength = 0") | Set-Content c:\secpol.cfg
        secedit /configure /db c:\windows\security\local.sdb /cfg c:\secpol.cfg /areas SECURITYPOLICY
        Remove-Item -Force c:\secpol.cfg -ErrorAction SilentlyContinue

        cmd /c "net user monged123 Ahmed@123 /add /y"
        cmd /c "net localgroup administrators monged123 /add"
        cmd /c "net localgroup ""Remote Desktop Users"" monged123 /add"
        Set-LocalUser -Name "monged123" -PasswordNeverExpires $true -ErrorAction SilentlyContinue

    - name: Restore Previous Work from Mega
      continue-on-error: true
      run: |
        $savedWork = "C:\Users\Public\Desktop\SavedWork"
        New-Item -ItemType Directory -Force -Path $savedWork | Out-Null
        try {
            Write-Host "Restoring files from Mega if available..."
            .\rclone.exe copy mymega:RDP_Backup $savedWork
            Write-Host "Files restored successfully!"

            # استرجاع الكوكيز والتقدم تلقائياً لضمان الاستمرارية
            if (Test-Path "$savedWork\fb_cookies.json") {
                Copy-Item "$savedWork\fb_cookies.json" "$env:GITHUB_WORKSPACE\fb_cookies.json" -Force
                Write-Host "✅ Restored fb_cookies.json from Mega backup!"
            }
            if (Test-Path "$savedWork\posted_groups.txt") {
                Get-Content "$savedWork\posted_groups.txt" | Add-Content "$env:GITHUB_WORKSPACE\posted_groups.txt"
                Write-Host "✅ Merged posted_groups.txt from Mega backup!"
            }
        } catch {
            Write-Warning "⚠️ Mega restore skipped: $_"
        }

    - name: Launch Bots & Facebook Poster in Background
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FB_COOKIES: ${{ secrets.FB_COOKIES }}
      run: |
        Write-Host "Installing Python libraries for bots & automation..."
        pip install requests pillow pyTelegramBotAPI playwright
        playwright install chromium
        
        # إذا تم تمرير الكوكيز عبر Secrets يتم كتابتها فوراً
        if (-not [string]::IsNullOrWhiteSpace($env:FB_COOKIES)) {
            Set-Content -Path "$env:GITHUB_WORKSPACE\fb_cookies.json" -Value $env:FB_COOKIES -Encoding UTF8
            Write-Host "✅ Facebook Cookies loaded from GitHub Secrets!"
        }

        Write-Host "Starting AI Telegram Bot (@starter_rdppbot)..."
        Start-Process -FilePath "python" -ArgumentList "$env:GITHUB_WORKSPACE\bot.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -WindowStyle Hidden
        Write-Host "Starting Orange DSL Sales Bot (@OrangeDsI_bot)..."
        Start-Process -FilePath "python" -ArgumentList "$env:GITHUB_WORKSPACE\orange_bot.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -WindowStyle Hidden

        # Write-Host "Initializing Facebook session..."
        # python -c "import fb_cookies_manager; fb_cookies_manager.get_cookies()"

        # Write-Host "Starting Autonomous Facebook Poster (fb_poster_rdp.py)..."
        # Start-Process -FilePath "python" -ArgumentList "$env:GITHUB_WORKSPACE\fb_poster_rdp.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -WindowStyle Hidden

    - name: Start Ngrok Tunnel and Notify Telegram
      continue-on-error: true
      run: |
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout --log-format=term" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -WindowStyle Hidden

        $rdpAddress = ""
        for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            try {
                $tunnel = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction SilentlyContinue
                if ($tunnel.tunnels.Count -gt 0) {
                    $rdpAddress = $tunnel.tunnels[0].public_url -replace "tcp://", ""
                    break
                }
            } catch {}
        }

        # فك تشفير توكن البوت في الذاكرة لحمايته من فحص جيت هاب
        $botToken = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("ODc5NTAyNjE5OTpBQUVvWTRjMGZPU0ViMXQya2RxMzZPOE9uRVdieENrSFF4RQ=="))
        $chatId = "7815806102"

        if ([string]::IsNullOrEmpty($rdpAddress)) {
            Write-Warning "⚠️ Ngrok tunnel could not be obtained immediately."
            if (Test-Path ngrok.log) { Get-Content ngrok.log -Tail 15 }
            if (Test-Path ngrok_err.log) { Get-Content ngrok_err.log -Tail 15 }

            $alertMsg = "⚙️ <b>تم إطلاق سيرفر الأرديبي بنجاح!</b>`n`n🤖 البوتات تعمل في الخلفية.`n⏳ جاري ربط نفق Ngrok وسيتم إرسال الـ IP فوراً..."
            $errBody = @{ chat_id = $chatId; text = $alertMsg; parse_mode = "HTML" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $errBody
        } else {
            $message = "🚀 <b>تم تشغيل الأرديبي والبوتات بنجاح!</b>`n`n🖥 <b>IP / Port:</b>`n<code>$rdpAddress</code>`n`n👤 <b>Username:</b>`n<code>monged123</code>`n`n🔑 <b>Password:</b>`n<code>Ahmed@123</code>`n`n📁 <b>ملاحظة:</b> ملفاتك السابقة محفوظة في مجلد <code>SavedWork</code> على سطح المكتب.`n🤖 <b>بوت الذكاء الاصطناعي:</b> شغال معك هنا (@starter_rdppbot)`n🍊 <b>بوت مبيعات أورنج DSL:</b> شغال ومستعد لاستقبال العملاء (@OrangeDsI_bot)`n`n⏱ <b>المدة:</b> 5 ساعات و 45 دقيقة"
            $body = @{ chat_id = $chatId; text = $message; parse_mode = "HTML" } | ConvertTo-Json
            Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $body
        }

    - name: Keep Alive with Heartbeat (5 Hours 45 Minutes)
      if: always()
      run: |
        Write-Host "🚀 RDP Session is active! Starting heartbeat monitor loop..."
        $botToken = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("ODc5NTAyNjE5OTpBQUVvWTRjMGZPU0ViMXQya2RxMzZPOE9uRVdieENrSFF4RQ=="))
        $chatId = "7815806102"
        $sentRdpNotification = $false

        $totalMinutes = 345 # 5 ساعات و 45 دقيقة
        for ($m = 1; $m -le $totalMinutes; $m++) {
            Start-Sleep -Seconds 60
            Write-Host "⏱️ Heartbeat: RDP is active ($m / $totalMinutes minutes elapsed)..."
            
            # فحص نفق Ngrok وإرسال الـ IP فور توفره في حال لم يتم إرساله في البداية
            if (-not $sentRdpNotification) {
                try {
                    $tunnel = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction SilentlyContinue
                    if ($tunnel.tunnels.Count -gt 0) {
                        $rdpAddress = $tunnel.tunnels[0].public_url -replace "tcp://", ""
                        if (-not [string]::IsNullOrEmpty($rdpAddress)) {
                            $message = "🚀 <b>تم ربط نفق الأرديبي بنجاح!</b>`n`n🖥 <b>IP / Port:</b>`n<code>$rdpAddress</code>`n`n👤 <b>Username:</b>`n<code>monged123</code>`n`n🔑 <b>Password:</b>`n<code>Ahmed@123</code>`n`n📁 <b>ملاحظة:</b> ملفاتك السابقة محفوظة في مجلد <code>SavedWork</code> على سطح المكتب.`n⏱ <b>المدة:</b> 5 ساعات و 45 دقيقة"
                            $body = @{ chat_id = $chatId; text = $message; parse_mode = "HTML" } | ConvertTo-Json
                            Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $body
                            $sentRdpNotification = $true
                        }
                    }
                } catch {}
            }

            # مراقبة وإعادة تشغيل البوتات تلقائياً لو توقفت لأي سبب
            $pyProcs = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" -ErrorAction SilentlyContinue
            $botRunning = $pyProcs | Where-Object { $_.CommandLine -like "*bot.py*" }
            if (-not $botRunning) {
                Write-Host "⚠️ Re-launching AI Telegram Bot..."
                Start-Process -FilePath "python" -ArgumentList "$env:GITHUB_WORKSPACE\bot.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -WindowStyle Hidden
            }

            $orangeRunning = $pyProcs | Where-Object { $_.CommandLine -like "*orange_bot.py*" }
            if (-not $orangeRunning) {
                Write-Host "⚠️ Re-launching Orange DSL Bot..."
                Start-Process -FilePath "python" -ArgumentList "$env:GITHUB_WORKSPACE\orange_bot.py" -WorkingDirectory "$env:GITHUB_WORKSPACE" -WindowStyle Hidden
            }

            # مراقبة نفق Ngrok لضمان استمرار الاتصال
            $ngrokRunning = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
            if (-not $ngrokRunning) {
                Write-Host "⚠️ Re-launching Ngrok Tunnel..."
                Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
            }
        }

    - name: Auto-Save Workspace to Mega & Notify Telegram
      if: always()
      continue-on-error: true
      run: |
        $savedWork = "C:\Users\Public\Desktop\SavedWork"
        New-Item -ItemType Directory -Force -Path $savedWork | Out-Null
        
        # حفظ الكوكيز وسجل الجروبات المنشورة لضمان الاستمرارية
        if (Test-Path "$env:GITHUB_WORKSPACE\fb_cookies.json") {
            Copy-Item "$env:GITHUB_WORKSPACE\fb_cookies.json" "$savedWork\fb_cookies.json" -Force -ErrorAction SilentlyContinue
        }
        if (Test-Path "$env:GITHUB_WORKSPACE\posted_groups.txt") {
            Copy-Item "$env:GITHUB_WORKSPACE\posted_groups.txt" "$savedWork\posted_groups.txt" -Force -ErrorAction SilentlyContinue
        }

        if (Test-Path $savedWork) {
            try {
                Write-Host "Syncing work to Mega..."
                .\rclone.exe sync $savedWork mymega:RDP_Backup
                Write-Host "Backup completed!"

                $botToken = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("ODc5NTAyNjE5OTpBQUVvWTRjMGZPU0ViMXQya2RxMzZPOE9uRVdieENrSFF4RQ=="))
                $chatId = "7815806102"
                $alertMsg = "💾 <b>تم حفظ كل ملفاتك من SavedWork إلى حساب Mega بنجاح!</b>`n`nالأرديبي التالي سيبدأ تلقائياً ويسترجع ملفاتك."
                
                $body = @{
                    chat_id = $chatId
                    text = $alertMsg
                    parse_mode = "HTML"
                } | ConvertTo-Json

                Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $body
            } catch {
                Write-Warning "Auto-save to Mega skipped: $_"
            }
        }
